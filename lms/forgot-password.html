<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Fahad Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="lms-common.css">
</head>
<body class="lms-page">
    <div class="lms-auth">
        <div class="lms-auth-card">
            <div class="lms-auth-card__logo">
                <div class="lms-auth-card__logo-icon"><i class="fa-solid fa-key"></i></div>
                <h1>Reset Password</h1>
                <p>Enter your email to receive a reset link</p>
            </div>

            <div id="errorMsg" class="lms-auth-card__error">
                <i class="fa-solid fa-circle-xmark"></i>
                <span id="errorText"></span>
            </div>
            <div id="successMsg" class="lms-auth-card__success">
                <i class="fa-solid fa-circle-check"></i>
                <span id="successText"></span>
            </div>

            <form id="resetForm">
                <div class="lms-form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="lms-input" placeholder="your@email.com" required>
                </div>
                <button type="submit" id="submitBtn" class="lms-btn lms-btn--primary lms-btn--block">
                    <i class="fa-solid fa-paper-plane"></i> Send Reset Link
                </button>
            </form>

            <div class="lms-auth-card__footer">
                <p>Remember your password? <a href="login.html">Sign In</a></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, sendPasswordResetEmail } from './firebase-config.js';

        const form = document.getElementById('resetForm');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');
        const successMsg = document.getElementById('successMsg');
        const successText = document.getElementById('successText');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('visible');
            successMsg.classList.remove('visible');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

            const email = document.getElementById('email').value.trim();

            try {
                await sendPasswordResetEmail(auth, email);
                showSuccess('Password reset email sent! Check your inbox (and spam folder).');
                form.querySelector('input').disabled = true;
            } catch (error) {
                const msg = error.code === 'auth/user-not-found' ? 'No account found with this email.' :
                            error.code === 'auth/invalid-email' ? 'Please enter a valid email.' :
                            error.message;
                showError(msg);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Reset Link';
            }
        });

        function showError(msg) {
            successMsg.classList.remove('visible');
            errorText.textContent = msg;
            errorMsg.classList.add('visible');
        }
        function showSuccess(msg) {
            errorMsg.classList.remove('visible');
            successText.textContent = msg;
            successMsg.classList.add('visible');
        }
    </script>
</body>
</html>
